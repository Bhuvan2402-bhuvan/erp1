services:
  - type: web
    name: vvitu-erp-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Supabase JWT Auth ─────────────────────────────────────────────────
      - key: SUPABASE_JWT_SECRET
        sync: false           # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Supabase PostgreSQL (Prisma) ──────────────────────────────────────
      - key: DATABASE_URL
        sync: false           # Get from Supabase → Settings → Database → Transaction pooler
      - key: DIRECT_URL
        sync: false           # Get from Supabase → Settings → Database → Session pooler
      # ── CORS ──────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGIN
        sync: false           # Set to your Vercel/Cloudflare frontend URL
      # ── Cloudflare R2 Storage ─────────────────────────────────────────────
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: vvitu-erp-storage
      - key: R2_PUBLIC_URL
        sync: false
      # ── Email ─────────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      # ── Legacy R2 variable names (backward compat) ────────────────────────
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: vvitu-erp-storage
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
