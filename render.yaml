services:
  - type: web
    name: vvitu-erp-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vvitu-erp-db
          property: connectionString
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: vvitu-erp-storage
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: vvitu-erp-db
    plan: free
    region: singapore
    databaseName: vvitu_erp
    user: vvitu_user
